<style>

body{
margin:0;
font-family:'Inter',sans-serif;
background:#0a0f1c;
color:#e5e7eb;
}

/* MAIN */
.main{
margin-left:220px;
padding:24px;
}

/* CARD */
.card{
background:#111827;
padding:16px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.04);
margin-bottom:16px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
}

/* INPUTS */
input,select{
padding:10px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.08);
background:#0f172a;
color:#e5e7eb;
}

/* BUTTON */
button{
padding:8px 14px;
background:#3b82f6;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#111827;
margin-top:15px;
}

th,td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.05);
text-align:left;
}

th{
color:#9ca3af;
}

/* PROGRESS */
.progress-bar{
width:100%;
height:20px;
background:#1f2937;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#22c55e;
text-align:center;
font-size:12px;
line-height:20px;
color:white;
}

.delete-btn{
background:#ef4444;
}

</style>

<body>

<div id="sidebar-container"></div>

<script>

/* SIDEBAR LOAD */

fetch("/components/sidebar.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("sidebar-container").innerHTML = data

const sidebar = document.getElementById("sidebar")

if(sidebar){
sidebar.style.display = "none"
}

setTimeout(async ()=>{

if(typeof applyMenuRBAC === "function"){
await applyMenuRBAC()
}

await initSidebar()

setActiveMenu()

if(window.lucide){
lucide.createIcons()
}

if(sidebar){
sidebar.style.display = "block"
}

},200)

})

function setActiveMenu(){

let currentPage = window.location.pathname.split("/").pop()

document.querySelectorAll("#sidebar a").forEach(link=>{

let page = link.getAttribute("data-page")

if(page === currentPage){
link.classList.add("active")
}

})

}

async function initSidebar(){

const userEl = document.getElementById("userName")

if(userEl){
userEl.innerText = "Admin"
}

}

</script>

<div class="main">

<h2>Interior Inventory & Work Tracker</h2>

<!-- INVENTORY -->
<div class="card">

<h3>Inventory Management</h3>

<div class="grid">

<input type="text" id="itemName" placeholder="Item Name">

<input type="number" id="quantity" placeholder="Quantity">

<input type="text" id="unit" placeholder="Unit">

<select id="status">
<option>Available</option>
<option>Low Stock</option>
<option>Out of Stock</option>
</select>

</div>

<br>

<button onclick="addInventory()">Add Inventory</button>

<table>

<thead>
<tr>
<th>Item</th>
<th>Quantity</th>
<th>Unit</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<!-- WORK -->
<div class="card">

<h3>Work Progress Tracker</h3>

<div class="grid">

<input type="text" id="workName" placeholder="Work Name">

<input type="text" id="assignedTo" placeholder="Assigned To">

<input type="number" id="progressValue" placeholder="Progress %">

<select id="workStatus">
<option>Pending</option>
<option>In Progress</option>
<option>Completed</option>
</select>

</div>

<br>

<button onclick="addWork()">Add Work</button>

<table>

<thead>
<tr>
<th>Work</th>
<th>Assigned</th>
<th>Progress</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="workTable"></tbody>

</table>

</div>

</div>

<script>

const supabaseClient = window.supabaseClient

/* LOAD INVENTORY */

async function loadInventory(){

const {data,error} = await supabaseClient
.from("inventory_items")
.select("*")
.order("created_at",{ascending:false})

if(error){
console.error(error)
return
}

inventoryTable.innerHTML = ""

data.forEach(item=>{

inventoryTable.innerHTML += `
<tr>

<td>${item.item_name}</td>

<td>${item.quantity}</td>

<td>${item.unit}</td>

<td>${item.status}</td>

<td>
<button class="delete-btn"
onclick="deleteInventory('${item.id}')">
Delete
</button>
</td>

</tr>
`

})

}

/* LOAD WORK */

async function loadWork(){

const {data,error} = await supabaseClient
.from("work_progress")
.select("*")
.order("created_at",{ascending:false})

if(error){
console.error(error)
return
}

workTable.innerHTML = ""

data.forEach(item=>{

workTable.innerHTML += `
<tr>

<td>${item.work_name}</td>

<td>${item.assigned_to}</td>

<td>
<div class="progress-bar">
<div class="progress-fill"
style="width:${item.progress}%">
${item.progress}%
</div>
</div>
</td>

<td>${item.status}</td>

<td>
<button class="delete-btn"
onclick="deleteWork('${item.id}')">
Delete
</button>
</td>

</tr>
`

})

}

/* ADD INVENTORY */

async function addInventory(){

const item =
document.getElementById("itemName").value

const quantity =
document.getElementById("quantity").value

const unit =
document.getElementById("unit").value

const status =
document.getElementById("status").value

if(!item || !quantity){
alert("Enter details")
return
}

const {error} = await supabaseClient
.from("inventory_items")
.insert([{

item_name:item,
quantity,
unit,
status

}])

if(error){
console.error(error)
alert("Save failed")
return
}

document.getElementById("itemName").value=""
document.getElementById("quantity").value=""
document.getElementById("unit").value=""

loadInventory()

}

/* ADD WORK */

async function addWork(){

const work =
document.getElementById("workName").value

const assigned =
document.getElementById("assignedTo").value

const progress =
document.getElementById("progressValue").value

const status =
document.getElementById("workStatus").value

if(!work || !assigned){
alert("Enter details")
return
}

const {error} = await supabaseClient
.from("work_progress")
.insert([{

work_name:work,
assigned_to:assigned,
progress,
status

}])

if(error){
console.error(error)
alert("Save failed")
return
}

document.getElementById("workName").value=""
document.getElementById("assignedTo").value=""
document.getElementById("progressValue").value=""

loadWork()

}

/* DELETE INVENTORY */

async function deleteInventory(id){

await supabaseClient
.from("inventory_items")
.delete()
.eq("id",id)

loadInventory()

}

/* DELETE WORK */

async function deleteWork(id){

await supabaseClient
.from("work_progress")
.delete()
.eq("id",id)

loadWork()

}

/* INITIAL LOAD */

loadInventory()
loadWork()

/* GLOBAL */

window.addInventory = addInventory
window.addWork = addWork
window.deleteInventory = deleteInventory
window.deleteWork = deleteWork

</script>

<script src="/js/navigation.js"></script>

</body>
