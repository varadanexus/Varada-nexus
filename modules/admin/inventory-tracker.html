<style>

body{
margin:0;
font-family:'Inter',sans-serif;
background:#0a0f1c;

/* MAIN */
.main{
margin-left:220px;

}

/* CARD */
.card{
background:#111827;
padding:16px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.05);
margin-bottom:16px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

/* INPUTS */
input,select,textarea{

width:100%;
box-sizing:border-box;

padding:10px;
border-radius:8px;

border:1px solid rgba(255,255,255,0.08);

background:#0f172a;
color:#e5e7eb;
}

/* BUTTON */
button{
padding:10px 14px;
background:#3b82f6;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,0.05);
text-align:left;
}

color:#94a3b8;

/* PROJECT HEADER */

justify-content:space-between;

gap:10px;
margin-bottom:15px;
}

padding:10px 14px;
background:#1e293b;
border-radius:8px;
cursor:pointer;
}

.tab.active{
background:#3b82f6;
}

/* DELETE */

}

.edit-btn{

}

<body>

<div id="sidebar-container"></div>

<script>

/* SIDEBAR */

fetch("/components/sidebar.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("sidebar-container").innerHTML = data

const sidebar = document.getElementById("sidebar")

if(sidebar){
sidebar.style.display = "none"
}

setTimeout(()=>{

setActiveMenu()

if(window.lucide){
lucide.createIcons()
}

if(sidebar){
sidebar.style.display = "block"
}

},200)

})

function setActiveMenu(){

let currentPage =
window.location.pathname.split("/").pop()

document.querySelectorAll("#sidebar a").forEach(link=>{

let page = link.getAttribute("data-page")

if(page === currentPage){
link.classList.add("active")
}

})

}

</script>

<div class="main">

<div class="project-header">

<div>
<h2>Interior ERP Module</h2>
<p>Project Management + Inventory + Tasks</p>
</div>

</div>

<!-- PROJECT DETAILS -->

<div class="card">

<h3>Create Project</h3>

<div class="grid">

<input id="projectName" placeholder="Project Name">

<input id="clientName" placeholder="Client Name">

<input id="phone" placeholder="Phone">

<input id="projectManager" placeholder="Project Manager">

<input id="budget" type="number" placeholder="Budget">

<input id="startDate" type="date">

<select id="projectStatus">

<option>Planning</option>
<option>In Progress</option>
<option>Completed</option>

</select>

<input id="siteAddress" placeholder="Site Address">

</div>

<br>

<button onclick="createProject()">
Create Project
</button>

</div>

<!-- PROJECT LIST -->

<div class="card">

<h3>Projects</h3>

<table>

<thead>
<tr>

<th>Project</th>
<th>Client</th>
<th>Budget</th>
<th>Status</th>
<th>Action</th>

</tr>
</thead>

<tbody id="projectTable"></tbody>

</table>

</div>

<!-- PROJECT MODULES -->

<div id="projectModules" class="hidden">

<div class="tabs">

<div class="tab active" onclick="openTab('inventoryTab',this)">
Inventory
</div>

<div class="tab" onclick="openTab('tasksTab',this)">
Tasks
</div>

<div class="tab" onclick="openTab('expensesTab',this)">
Expenses
</div>

</div>

<!-- INVENTORY -->

<div id="inventoryTab" class="card">

<h3>Project Inventory</h3>

<div class="grid">

<input id="invItem" placeholder="Material Name">

<input id="invQty" type="number" placeholder="Quantity">

<input id="invUnit" placeholder="Unit">

<input id="invCost" type="number" placeholder="Cost">

<input id="invVendor" placeholder="Vendor">

<input id="invNotes" placeholder="Notes">

</div>

<br>

<button onclick="addInventory()">
Add Inventory
</button>

<table>

<thead>

<tr>

<th>Material</th>
<th>Qty</th>
<th>Unit</th>
<th>Cost</th>
<th>Vendor</th>
<th>Notes</th>
<th>Action</th>

</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<!-- TASKS -->

<div id="tasksTab" class="card hidden">

<h3>Project Tasks</h3>

<p>Coming Next</p>

</div>

<!-- EXPENSES -->

<div id="expensesTab" class="card hidden">

<h3>Project Expenses</h3>

<p>Coming Next</p>

</div>

</div>

</div>

<script>

const supabaseClient = window.supabaseClient

let selectedProject = null

/* CREATE PROJECT */

async function createProject(){

const payload = {

project_name:
projectName.value,

client_name:
clientName.value,

phone:
phone.value,

site_address:
siteAddress.value,

budget:
budget.value,

start_date:
startDate.value,

status:
projectStatus.value,

project_manager:
projectManager.value

}

const {error} = await supabaseClient
.from("interior_projects")
.insert([payload])

if(error){
console.error(error)
alert("Error creating project")
return
}

alert("Project Created")

clearProjectForm()

loadProjects()

}

/* LOAD PROJECTS */

async function loadProjects(){

const {data,error} = await supabaseClient
.from("interior_projects")
.select("*")
.order("created_at",{ascending:false})

if(error){
console.error(error)
return
}

projectTable.innerHTML = ""

data.forEach(project=>{

projectTable.innerHTML += `

<tr>

<td>${project.project_name}</td>

<td>${project.client_name}</td>

<td>₹${project.budget || 0}</td>

<td>${project.status}</td>

<td>

<button onclick="selectProject('${project.id}')">
Open
</button>

<button class="delete-btn"
onclick="deleteProject('${project.id}')">
Delete
</button>

</td>

</tr>

`

})

}

/* SELECT PROJECT */

async function selectProject(id){

selectedProject = id

projectModules.classList.remove("hidden")

await loadInventory()

}

/* DELETE */

async function deleteProject(id){

if(!confirm("Delete project?")) return

await supabaseClient
.from("interior_projects")
.delete()
.eq("id",id)

loadProjects()

}

/* FORM RESET */

function clearProjectForm(){

projectName.value=""
clientName.value=""
phone.value=""
siteAddress.value=""
budget.value=""
projectManager.value=""

}

/* TABS */

function openTab(id,el){

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"))

el.classList.add("active")

document.getElementById("inventoryTab")
.classList.add("hidden")

document.getElementById("tasksTab")
.classList.add("hidden")

document.getElementById("expensesTab")
.classList.add("hidden")

document.getElementById(id)
.classList.remove("hidden")

}

/* =========================
PROJECT INVENTORY
========================= */

async function addInventory(){

if(!selectedProject){
alert("Select project first")
return
}

const payload = {

project_id:selectedProject,

item_name:invItem.value,

quantity:invQty.value,

unit:invUnit.value,

cost:invCost.value,

vendor:invVendor.value,

notes:invNotes.value

}

const {error} = await supabaseClient
.from("project_inventory")
.insert([payload])

if(error){
console.error(error)
alert("Error adding inventory")
return
}

clearInventoryForm()

loadInventory()

}

/* LOAD INVENTORY */

async function loadInventory(){

if(!selectedProject) return

const {data,error} = await supabaseClient
.from("project_inventory")
.select("*")
.eq("project_id",selectedProject)
.order("created_at",{ascending:false})

if(error){
console.error(error)
return
}

inventoryTable.innerHTML = ""

data.forEach(item=>{

inventoryTable.innerHTML += `

<tr>

<td>${item.item_name || ""}</td>

<td>${item.quantity || 0}</td>

<td>${item.unit || ""}</td>

<td>₹${item.cost || 0}</td>

<td>${item.vendor || ""}</td>

<td>${item.notes || ""}</td>

<td>

<button class="delete-btn"
onclick="deleteInventory('${item.id}')">
Delete
</button>

</td>

</tr>

`

})

}

/* DELETE INVENTORY */

async function deleteInventory(id){

if(!confirm("Delete inventory item?")) return

await supabaseClient
.from("project_inventory")
.delete()
.eq("id",id)

loadInventory()

}

/* CLEAR FORM */

function clearInventoryForm(){

invItem.value=""
invQty.value=""
invUnit.value=""
invCost.value=""
invVendor.value=""
invNotes.value=""

}
  
/* INIT */

loadProjects()

/* GLOBAL */

window.createProject = createProject
window.selectProject = selectProject
window.deleteProject = deleteProject
window.openTab = openTab
window.addInventory = addInventory
window.deleteInventory = deleteInventory
  
</script>

<script src="/js/navigation.js"></script>

</body>
</html>
