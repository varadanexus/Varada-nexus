<!DOCTYPE html>
<html>

<head>

<title>Site Updates - Varada Nexus</title>

<link rel="icon" href="/images/logo.png">
  
<base href="/">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/session-check.js"></script>
<script src="/js/menu-rbac.js"></script>
<script src="/js/global-logout.js"></script>
<script src="/js/rbac.js"></script>
<script src="/js/navigation.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
  
<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#0a0f1c; 
color:white;
}

.main{
margin-left:220px;
padding:24px;
max-width:1200px;
}

.card{
background:#111827;
padding:20px;
border-radius:14px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,0.06);
}

input,select,textarea{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
margin-top:10px;
box-sizing:border-box;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
margin-top:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
}

.photo-card{
background:#0f172a;
padding:10px;
border-radius:12px;
}

.photo-card{
transition:0.25s;
border:1px solid rgba(255,255,255,0.05);
overflow:hidden;
}

.photo-card:hover{
transform:translateY(-4px);
border-color:rgba(59,130,246,0.4);
box-shadow:0 10px 25px rgba(37,99,235,0.15);
}
  
.photo-card img{
width:100%;
height:240px;
object-fit:cover;
background:#0f172a;
display:block;
border-radius:10px;
}

small{
color:#94a3b8;
}

.upload-box{
display:block;
margin-top:14px;
cursor:pointer;
}

.upload-ui{
border:2px dashed rgba(59,130,246,0.35);
border-radius:16px;
padding:30px;
text-align:center;
background:#0f172a;
transition:0.25s;
}

.upload-ui:hover{
border-color:#3b82f6;
background:#111827;
}

.upload-btn{
display:inline-block;
margin-top:14px;
padding:10px 18px;
background:#2563eb;
border-radius:10px;
font-weight:600;
}

#selectedFiles{
margin-top:15px;
font-size:13px;
color:#94a3b8;
line-height:1.8;
}

.image-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.92);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
padding:30px;
box-sizing:border-box;
}

.image-modal img{
max-width:95%;
max-height:95%;
border-radius:14px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.close-btn{
position:absolute;
top:20px;
right:30px;
font-size:34px;
cursor:pointer;
color:white;
}
  
</style>

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>
  
<div class="main">

<h1>Construction Site Updates</h1>

<div class="card">

<h3>Upload Site Photos</h3>

<select id="projectSelect"></select>

<input type="date" id="uploadDate">

<textarea
id="caption"
placeholder="Daily update caption..."
></textarea>

<label class="upload-box">

<input
type="file"
id="photoInput"
multiple
accept="image/*"
onchange="showSelectedFiles()"
hidden
>

<div class="upload-ui">

<div style="font-size:42px;">
📸
</div>

<h3>Select Site Photos</h3>

<p>
You can select multiple photos
</p>

<span class="upload-btn">
Choose Photos
</span>

<div id="selectedFiles"></div>

</div>

</label>

<button onclick="uploadPhotos()">
Upload Site Photos
</button>

</div>

<div class="card">

<h3>Recent Site Updates</h3>

<div
class="grid"
id="gallery"
></div>

</div>

</div>

<script>

const supabaseUrl =
"https://ticsgbtxfhhihamejiss.supabase.co"

const supabaseAnonKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpY3NnYnR4ZmhoaWhhbWVqaXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjE5MjksImV4cCI6MjA4ODk5NzkyOX0.rWgLPUMNnHIouP4ANQYfmzr3jAopfd3AFouoAMhSkmg"

const sb =
window.supabaseClient || 
supabase.createClient(
supabaseUrl,
supabaseAnonKey
)

/* LOAD SIDEBAR + RBAC */

fetch("/components/sidebar.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("sidebar-container").innerHTML = data

const sidebar = document.getElementById("sidebar")

if(sidebar){
sidebar.style.display = "none"
}

setTimeout(async()=>{

if(typeof applyMenuRBAC==="function"){
await applyMenuRBAC()
}

await initSidebar()

setActiveMenu()

if(window.lucide){

try{
lucide.createIcons()
}catch(e){
console.log(e)
}

}

if(sidebar){
sidebar.style.display = "block"
}

},200)

})

/* SIDEBAR USER */

async function initSidebar(){

const {data:{session}} =
await sb.auth.getSession()
  
if(!session) return

const authId = session.user.id
const email = session.user.email

const userEl =
document.getElementById("userName")

if(userEl){
userEl.innerText =
email.split("@")[0]
}

const {data:user} =
await sb
.from("users")
.select("id")
.eq("auth_id",authId)
.single()

if(!user) return

const {data:userRoles} =
await supabaseClient
.from("user_roles")
.select("role_id")
.eq("user_id",user.id)

if(!userRoles?.length) return

const roleId =
userRoles[0].role_id

const {data:role} =
await supabaseClient
.from("roles")
.select("role_name")
.eq("id",roleId)
.single()

if(role){

const roleEl =
document.getElementById("userRole")

if(roleEl){
roleEl.innerText =
role.role_name
}

}

}

function setActiveMenu(){

let currentPage =
window.location.pathname
.split("/")
.pop()

document
.querySelectorAll("#sidebar a")
.forEach(link=>{

if(
link.dataset.page === currentPage
){
link.classList.add("active")
}

})

}
  
let projects = []

init()

async function init(){

document.getElementById(
"uploadDate"
).value =
new Date().toISOString().split("T")[0]

await loadProjects()

await loadGallery()

}

async function loadProjects(){

const {data} =
await supabaseClient
.from("interior_projects")
.select("*")
.order("project_name")

projects = data || []

projectSelect.innerHTML =
'<option value="">Select Project</option>' +

projects.map(p=>`

<option value="${p.id}">

${p.project_name}

</option>

`).join("")

}

async function uploadPhotos(){

const projectId =
projectSelect.value

if(!projectId){
alert("Select project")
return
}

const files =
document.getElementById(
"photoInput"
).files

if(!files.length){
alert("Select photos")
return
}

const project =
projects.find(
p=>p.id == projectId
)

const uploadDate =
document.getElementById(
"uploadDate"
).value

const caption =
document.getElementById(
"caption"
).value

for(const file of files){

const formData =
new FormData()

formData.append(
"file",
file
)

formData.append(
"project_name",
project.project_name
)

formData.append(
"upload_date",
uploadDate
)

formData.append(
"caption",
caption
)

const res = await fetch(
"https://ticsgbtxfhhihamejiss.supabase.co/functions/v1/upload-site-photo",
{
method:"POST",
body:formData
}
)

const result =
await res.json()

if(result.success){

await supabaseClient
.from("project_site_photos")
.insert({

project_id:projectId,

photo_url:
result.fileUrl,

drive_file_id:
result.fileId,

caption,

upload_date:
uploadDate

})

}

}

alert("Photos uploaded ✅")

document.getElementById(
"caption"
).value = ""

document.getElementById(
"photoInput"
).value = ""

await loadGallery()

}

async function loadGallery(){

const {data} =
await supabaseClient
.from("project_site_photos")
.select(`
*,
interior_projects(
project_name
)
`)
.order(
"created_at",
{ascending:false}
)

gallery.innerHTML = ""

data?.forEach(item=>{

gallery.innerHTML += `

<div class="photo-card">

<img 
src="${item.photo_url}"
loading="lazy"
referrerpolicy="no-referrer"
onclick="openImage('${item.photo_url}')"
style="cursor:pointer"
onerror="this.style.display='none'"
>

<h4>

${item.interior_projects?.project_name || ""}

</h4>

<p>

${item.caption || ""}

</p>

<small>

${item.upload_date || ""}

</small>

</div>

`

})

}

function openImage(url){

document.getElementById(
"imageModal"
).style.display = "flex"

document.getElementById(
"modalImage"
).src = url

}

function closeImage(){

document.getElementById(
"imageModal"
).style.display = "none"

}
  
function showSelectedFiles(){

const files =
document.getElementById(
"photoInput"
).files

let html = ""

for(const file of files){

html += `
<div>
✅ ${file.name}
</div>
`

}

document.getElementById(
"selectedFiles"
).innerHTML = html

}
  
</script>

<div id="imageModal" class="image-modal">

<span
class="close-btn"
onclick="closeImage()"
>
✕
</span>

<img id="modalImage">

</div>
  
</body>

</html>
