<!-- IMAGE MODAL -->

<div
  id="imageModal"
  class="
    hidden
    fixed
    inset-0
    bg-black/80
    z-50
    flex
    items-center
    justify-center
    p-10
  "
>

  <!-- CLOSE BUTTON -->

    onclick="closeImageModal()"

      absolute
      top-5
      right-5
      text-white
      text-4xl
    "
  >
    ×
  </button>

<a
  id="downloadImageBtn"
  download
  target="_blank"

  class="
    absolute
    top-5
    left-5
    bg-white
    text-black
    px-4
    py-2
    rounded-lg
    font-semibold
    shadow-lg
  "
>
  Download
</a>
  
  <!-- IMAGE -->
  <img
    id="modalImage"
    class="
      max-w-full
      max-h-full
      rounded-xl
      shadow-2xl
    "
  >

</div>

<!-- PDF MODAL -->

<div
  id="pdfModal"
  class="
    hidden
    fixed
    inset-0
    bg-black/80
    z-50
    flex
    items-center
    justify-center
    p-5
  "
>

  <!-- CLOSE -->
  <button
    onclick="closePdfModal()"
    class="
      absolute
      top-5
      right-5
      text-white
      text-4xl
      z-50
    "
  >
    ×
  </button>

<a
  id="downloadPdfBtn"
  download
  target="_blank"

  class="
    absolute
    top-5
    left-5
    bg-white
    text-black
    px-4
    py-2
    rounded-lg
    font-semibold
    shadow-lg
    z-50
  "
>
  Download
</a>
  
  <!-- PDF -->
  <iframe
    id="pdfFrame"
    class="
      w-full
      h-full
      bg-white
      rounded-xl
    "
  ></iframe>

</div>


  
<script>

window.openImageModal = function(url){

  document
  .getElementById("modalImage")
  .src = url

document
.getElementById("downloadImageBtn")
.href = url
  
  document
  .getElementById("imageModal")
  .classList
  .remove("hidden")

}

window.closeImageModal = function(){

  document
  .getElementById("imageModal")
  .classList
  .add("hidden")

}

window.openPdfModal = function(url){

  // EXTRACT FILE ID
  const fileId =
  url.split("id=")[1]

  // GOOGLE PREVIEW URL
  const previewUrl =
  `https://drive.google.com/file/d/${fileId}/preview`

document
.getElementById("downloadPdfBtn")
.href = url
  
  document
  .getElementById("pdfFrame")
  .src = previewUrl

  document
  .getElementById("pdfModal")
  .classList
  .remove("hidden")

}

window.closePdfModal = function(){

  document
  .getElementById("pdfModal")
  .classList
  .add("hidden")

  document
  .getElementById("pdfFrame")
  .src = ""

}
  
</script>
