<body>

<div id="sidebar-container"></div>

<script>

fetch("/components/sidebar.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("sidebar-container").innerHTML = data

const sidebar = document.getElementById("sidebar")

if(sidebar){
    sidebar.style.display = "none"
}

setTimeout(async ()=>{

    if(typeof applyMenuRBAC === "function"){
        await applyMenuRBAC()
    }

    await initSidebar()
    setActiveMenu()

    if(window.lucide){
        lucide.createIcons()
    }

    if(sidebar){
        sidebar.style.display = "block"
    }

},200)

})

function setActiveMenu(){
let currentPage = window.location.pathname.split("/").pop()

document.querySelectorAll("#sidebar a").forEach(link=>{
    let page = link.getAttribute("data-page")
    if(page === currentPage){
        link.classList.add("active")
    }
})
}

async function initSidebar(){

const supabaseClient = window.supabaseClient

const {data:{session}} = await supabaseClient.auth.getSession()

if(!session){
    window.location.href = "login.html"
    return
}

const email = session.user.email
const userEl = document.getElementById("userName")

if(userEl){
    userEl.innerText = email.split("@")[0]
}

const {data:user} = await supabaseClient
.from("users")
.select("id")
.eq("auth_id", session.user.id)
.single()

if(!user) return

const {data:userRole} = await supabaseClient
.from("user_roles")
.select("role_id")
.eq("user_id", user.id)
.single()

if(!userRole) return

const {data:role} = await supabaseClient
.from("roles")
.select("role_name")
.eq("id", userRole.role_id)
.single()

if(role){
const roleEl = document.getElementById("userRole")

if(roleEl){
    roleEl.innerText = role.role_name
}
}

window.logout = async function(){
await supabaseClient.auth.signOut()
window.location.href="/website/login.html"
}

}

</script>
  
<div class="main">

<h2>Meeting Admin Panel</h2>

<!-- CREATE MEETING -->
<div class="card">
<h3>Create Meeting</h3>

<input id="title" placeholder="Meeting Title">
<input id="scheduled_at" type="datetime-local">

<button onclick="createMeeting()">Create Meeting</button>

<p id="meetingInfo"></p>

<button onclick="endMeeting()" 
style="background:#ef4444;margin-top:10px;">
End Meeting
</button>
  
</div>

<!-- MEETINGS LIST -->
<div class="card">
<h3>All Meetings</h3>

<table class="table" id="meetingTable">
<tr>
<th>Title</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>

</div>
  
<!-- ADD USERS -->
<div class="card">
<h3>Generate Credentials</h3>

<select id="meetingSelect" class="form-control" onchange="selectMeeting()">
<option value="">Select Meeting</option>
</select>

<input id="meetingId" class="form-control" placeholder="Meeting ID" readonly>

<input id="name" class="form-control" placeholder="Enter Name">

<input id="phone" class="form-control" placeholder="Enter Phone Number">

<select id="role" class="form-control">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>

<button id="genBtn" onclick="generateUser()" disabled
style="height:44px;width:100%;">Generate Credential</button>

<table class="table" id="userTable">
<tr>
<th>Username</th>
<th>Password</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>

</div>

</div>

<script>

const supabaseClient = window.supabaseClient

let currentMeetingId = null;
let realtimeChannel = null;
let refreshInterval = null;

  
window.onload = async function(){

await loadMeetings();

let savedId = localStorage.getItem("meeting_id");

if(savedId){
currentMeetingId = savedId;

document.getElementById("meetingId").value = savedId;
document.getElementById("genBtn").disabled = false;
  
document.getElementById("meetingSelect").value = savedId;

await loadCredentials();
subscribeToWaitingUsers();
startAutoRefresh();   // 🔥 ADD THIS
}

}
  
/* CREATE MEETING */
async function createMeeting(){

let title = document.getElementById("title").value;
let scheduledAt = document.getElementById("scheduled_at").value;

let room = "VN_" + Date.now() + "_" + Math.random().toString(36).substring(2,6);

const { data } = await supabaseClient
.from("meetings")
.insert([{ 
  title, 
  room_name: room,
  status: "waiting",
  scheduled_at: scheduledAt ? new Date(scheduledAt).toISOString() : null,
  scheduled_local: scheduledAt
}])
.select()
.single();
  
currentMeetingId = data.id;

document.getElementById("meetingInfo").innerText =
"Meeting Created | ID: " + data.id + " | Room: " + room;

document.getElementById("meetingId").value = data.id;
document.getElementById("genBtn").disabled = false;

localStorage.setItem("meeting_id", data.id);
await loadMeetings();
  
}

/* GENERATE USER */
async function generateUser(){

let meetingId = document.getElementById("meetingId").value;
let role = document.getElementById("role").value;
let phoneInput = document.getElementById("phone").value.trim();
let name = document.getElementById("name").value.trim();

  
if(!meetingId){
  alert("Enter meeting ID");
  return;
}

if(!phoneInput){
  alert("Enter phone number");
  return;
}

if(!name){
  alert("Enter name");
  return;
}
  
if(phoneInput.length !== 10){
  alert("Enter valid 10 digit number");
  return;
}

let phone = "91" + phoneInput;
const meetingLink = `${window.location.origin}/meeting-login.html?id=${meetingId}`;

const { data: meeting, error: meetingError } = await supabaseClient
.from("meetings")
.select("*")
.eq("id", meetingId)
.single();

if(meetingError || !meeting){
  alert("Meeting not found");
  return;
}

const { data: existing } = await supabaseClient
.from("credentials")
.select("*")
.eq("phone", phone)
.eq("meeting_id", meetingId);

if(existing && existing.length > 0){
  alert("User already exists for this meeting");
  return;
}
  
/* INSERT */
const { data, error } = await supabaseClient
.from("credentials")
.insert([{
  meeting_id: meetingId,
  phone: phone,
  name: name,
  role: role,
  is_active: true,
  is_approved: role === "admin"   // ✅ IMPORTANT
}])
.select();

console.log("INSERT:", data, error);

if(error){
  alert("Insert failed ❌");
  console.error(error);
  return;
}

// 🚀 SEND WHATSAPP MESSAGE (WITH ERROR HANDLING)
try {

const waRes = await fetch('https://ticsgbtxfhhihamejiss.supabase.co/functions/v1/send-whatsapp', {
  method: 'POST',
  headers: {
    "Content-Type": "application/json",
    "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpY3NnYnR4ZmhoaWhhbWVqaXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjE5MjksImV4cCI6MjA4ODk5NzkyOX0.rWgLPUMNnHIouP4ANQYfmzr3jAopfd3AFouoAMhSkmg"
  },
  body: JSON.stringify({
    phone: phone,
    name: name,
    meeting_link: meetingLink,
    scheduled_at: meeting.scheduled_local || meeting.scheduled_at
  })
});

const waData = await waRes.json();

if(!waRes.ok){
  console.error("WhatsApp error:", waData);
  alert("User created but WhatsApp failed");
}

} catch (err) {
  console.error("WhatsApp send failed:", err);
  alert("WhatsApp service error");
}
document.getElementById("phone").value = "";
document.getElementById("name").value = "";
  
await loadCredentials();
}

async function deleteCredential(phone, btn){

if(!confirm("Delete this credential?")) return;

const { error } = await supabaseClient
.from("credentials")
.delete()
.eq("phone", phone);

if(error){
  alert("Error deleting");
  console.error(error);
  return;
}

/* ✅ REMOVE ROW */
btn.parentElement.parentElement.remove();

}

function copyCredential(username, password){
navigator.clipboard.writeText(
`Username: ${username} | Password: ${password}`
);
alert("Copied to clipboard");
}

async function regeneratePassword(username){

let newPass = Math.random().toString(36).substring(2,8);

const { error } = await supabaseClient
.from("credentials")
.update({ password: newPass })
.eq("username", username);

if(error){
alert("Error updating password");
console.error(error);
return;
}

/* update UI */
document.getElementById("pass-"+username).innerText = newPass;

alert("Password updated");
}

async function toggleActive(phone, btn){

let isCurrentlyDisable = btn.innerText === "Disable";

const { error } = await supabaseClient
.from("credentials")
.update({ is_active: !isCurrentlyDisable })
.eq("phone", phone);

if(error){
alert("Error updating status");
console.error(error);
return;
}

let statusCell = document.getElementById("status-"+phone);

if(isCurrentlyDisable){
btn.innerText = "Enable";
btn.style.background = "#22c55e";

statusCell.innerHTML = `
<span style="color:#22c55e;">Admitted</span><br>
<span style="color:#ef4444;">Inactive</span>
`;

}else{
btn.innerText = "Disable";
btn.style.background = "#f59e0b";

statusCell.innerHTML = `
<span style="color:#22c55e;">Admitted</span><br>
<span style="color:#22c55e;">Active</span>
`;

}
}

async function loadMeetings(){

const { data, error } = await supabaseClient
.from("meetings")
.select("*")
.order("created_at", { ascending: false });

if(error){
console.error(error);
return;
}

// ✅ DROPDOWN (EXISTING)
let dropdown = document.getElementById("meetingSelect");
dropdown.innerHTML = `<option value="">Select Meeting</option>`;

data.forEach(m => {
dropdown.innerHTML += `
<option value="${m.id}">
${m.title} (${m.status})
</option>
`;
});

// ✅ NEW TABLE
let table = document.getElementById("meetingTable");

table.innerHTML = `
<tr>
<th>Title</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
`;

data.forEach(m => {

let date = m.scheduled_local || "-";

let row = table.insertRow();

row.innerHTML = `
<td>${m.title}</td>
<td>${date}</td>
<td>${m.status}</td>

<td>

<button onclick="editMeeting('${m.id}', '${m.title}', '${m.scheduled_local || ''}')"
style="background:#3b82f6;padding:5px 8px;border-radius:6px;margin:2px;">
Edit
</button>

<button onclick="deleteMeeting('${m.id}')"
style="background:#ef4444;padding:5px 8px;border-radius:6px;margin:2px;">
Delete
</button>

</td>
`;

});

}

function selectMeeting(){

let selectedId = document.getElementById("meetingSelect").value;

if(!selectedId) return;

currentMeetingId = selectedId;

document.getElementById("meetingId").value = selectedId;
document.getElementById("genBtn").disabled = false;

localStorage.setItem("meeting_id", selectedId);

loadCredentials();
subscribeToWaitingUsers();
startAutoRefresh();   // 🔥 ADD THIS

}
  
async function loadCredentials(){

if(!currentMeetingId) return;

const { data, error } = await supabaseClient
.from("credentials")
.select("name, phone, role, is_active, is_approved, status")
.eq("meeting_id", currentMeetingId);

if(error){
console.error(error);
return;
}

let table = document.getElementById("userTable");

/* RESET TABLE */
table.innerHTML = `
<tr>
<th>Name</th>
<th>Phone</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>
</tr>
`;

data.forEach(user => {

let row = table.insertRow();

row.innerHTML = `
<td>${user.name || "-"}</td>
<td>${user.phone}</td>
<td>${user.role}</td>

<td id="status-${user.phone}">

<span style="color:${
  user.status === 'in_meeting' ? '#22c55e' :
  user.status === 'waiting' ? '#facc15' :
  '#ef4444'
};">
${user.status || 'offline'}
</span>

<br>

<span style="color:${user.is_active ? '#22c55e' : '#ef4444'};">
${user.is_active ? 'Active' : 'Inactive'}
</span>

</td>

<td>

<button onclick="toggleApproval('${user.phone}', ${user.is_approved})"
style="background:${user.is_approved ? '#ef4444' : '#22c55e'};padding:5px 8px;border-radius:6px;margin:2px;">
${user.is_approved ? 'Remove' : 'Admit'}
</button>

<button onclick="toggleActive('${user.phone}', this)"
style="background:${user.is_active ? '#f59e0b' : '#22c55e'};padding:5px 8px;border-radius:6px;margin:2px;">
${user.is_active ? 'Disable' : 'Enable'}
</button>

<button onclick="deleteCredential('${user.phone}', this)"
style="background:#ef4444;padding:5px 8px;border-radius:6px;margin:2px;">
Delete
</button>

</td>
`;

});

}

async function endMeeting(){

if(!currentMeetingId){
alert("No meeting selected");
return;
}

if(!confirm("End this meeting? All users will be removed.")) return;

/* 1. DELETE ALL CREDENTIALS */
const { error: deleteError } = await supabaseClient
.from("credentials")
.delete()
.eq("meeting_id", currentMeetingId);

if(deleteError){
alert("Error deleting users");
console.error(deleteError);
return;
}

/* 2. UPDATE MEETING STATUS */
const { data, error: updateError } = await supabaseClient
.from("meetings")
.update({ status: "ended" })
.eq("id", currentMeetingId)
.select();

console.log("UPDATE RESULT:", data, updateError);

if(updateError){
alert("Error updating meeting");
console.error(updateError);
return;
}

/* 3. CLEAR UI */
document.getElementById("userTable").innerHTML = `
<tr>
<th>Username</th>
<th>Password</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>
</tr>
`;

alert("Meeting ended");

/* 4. RESET STATE */
localStorage.removeItem("meeting_id");
currentMeetingId = null;

document.getElementById("meetingId").value = "";
document.getElementById("meetingSelect").value = "";
document.getElementById("genBtn").disabled = true;

/* 5. REFRESH MEETINGS LIST */
await loadMeetings();

}
  
async function editMeeting(id, title, scheduled){

let newTitle = prompt("Edit Title:", title);
if(newTitle === null) return;

let newDate = prompt("Edit Date (YYYY-MM-DDTHH:MM):", scheduled || "");

const { error } = await supabaseClient
.from("meetings")
.update({
  title: newTitle,
  scheduled_local: newDate,
  scheduled_at: newDate ? new Date(newDate).toISOString() : null
})
.eq("id", id);

if(error){
alert("Update failed");
console.error(error);
return;
}

alert("Meeting updated");
await loadMeetings();
}

async function deleteMeeting(id){

if(!confirm("Delete this meeting?")) return;

// 🔴 DELETE USERS FIRST (FK SAFETY)
await supabaseClient
.from("credentials")
.delete()
.eq("meeting_id", id);

// 🔴 DELETE MEETING
const { error } = await supabaseClient
.from("meetings")
.delete()
.eq("id", id);

if(error){
alert("Delete failed");
console.error(error);
return;
}

alert("Meeting deleted");
await loadMeetings();
}

function subscribeToWaitingUsers(){

  // 🔴 REMOVE OLD CHANNEL
  if(realtimeChannel){
    supabaseClient.removeChannel(realtimeChannel);
  }

  realtimeChannel = supabaseClient
    .channel("realtime-credentials-" + currentMeetingId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "credentials",
        filter: `meeting_id=eq.${currentMeetingId}`
      },
      (payload) => {
        console.log("REALTIME UPDATE:", payload);
        loadCredentials();
      }
    )
    .subscribe();

}



async function toggleApproval(phone, isApproved){

  const { error } = await supabaseClient
    .from("credentials")
    .update({ is_approved: !isApproved })
    .eq("phone", phone)
    .eq("meeting_id", currentMeetingId);

  if(error){
    alert("Error updating approval");
    console.error(error);
    return;
  }

  // 🔥 ADD THIS LINE
  await loadCredentials();

}

function startAutoRefresh(){

  if(refreshInterval){
    clearInterval(refreshInterval);
  }

  refreshInterval = setInterval(() => {
    loadCredentials();
  }, 2000);

}
  
</script>

<script>
function getCurrentModule(){
    const path = window.location.pathname.split("/")
    const moduleIndex = path.indexOf("modules")
    return moduleIndex !== -1 ? path[moduleIndex + 1] : "logistics"
}

function go(page){
    const module = getCurrentModule()
    window.location.href = "/modules/" + module + "/" + page
}
</script>
