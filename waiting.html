<!DOCTYPE html>
<html>
<head>
<title>Waiting Room</title>
<base href="/">
  
<link rel="icon" type="image/png" sizes="32x32" href="/images/logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/logo.png">
  
<style>
body{
margin:0;
font-family:'Inter',sans-serif;
min-height:100vh;
background:linear-gradient(-45deg,#020617,#0f172a,#1e3a8a,#020617);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
display:flex;
justify-content:center;
align-items:center;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
background:rgba(15,23,42,0.8);
padding:40px;
border-radius:16px;
text-align:center;
width:360px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.loader{
margin:20px auto;
width:40px;
height:40px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid #6366f1;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="card">

  <h2 id="meetingTitle">Loading meeting...</h2>

  <p style="margin-top:10px;font-size:14px;color:#94a3b8;">
    Hello <b id="userName">User</b>
  </p>

  <h3 style="margin-top:20px;">
    Waiting for host to admit you...
  </h3>

  <p style="font-size:13px;color:#64748b;margin-top:10px;">
    Please stay on this page
  </p>

  <div class="loader"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = supabase.createClient(
  "https://ticsgbtxfhhihamejiss.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpY3NnYnR4ZmhoaWhhbWVqaXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjE5MjksImV4cCI6MjA4ODk5NzkyOX0.rWgLPUMNnHIouP4ANQYfmzr3jAopfd3AFouoAMhSkmg"
);

const params = new URLSearchParams(window.location.search);
const phone = params.get("phone");
const meeting = params.get("meeting");
let userName = "";
let meetingTitle = "";

if(!phone || !meeting){
  document.body.innerHTML = "<h3 style='color:white;text-align:center;margin-top:40vh;'>Invalid access</h3>";
  throw new Error("Missing params");
}
  
async function loadDetails(){

  const { data, error } = await supabaseClient
    .from("credentials")
    .select("name, meetings(title)")
    .eq("phone", phone)
    .eq("meeting_id", meeting)
    .single();

console.log("WAITING DATA:", data, error);
  
  if(data && data.meetings){
    userName = data.name || "User";
    meetingTitle = data.meetings?.title || "Meeting";

    document.getElementById("userName").innerText = userName;
    document.getElementById("meetingTitle").innerText = meetingTitle;
  }

}

(async () => {
  await loadDetails();

  // 🔥 SET STATUS = WAITING (ADD THIS)
  await supabaseClient
    .from("credentials")
    .update({ status: "waiting" })
    .eq("phone", phone)
    .eq("meeting_id", meeting);

  await checkInitial();
})();

  
// ✅ INITIAL CHECK (FIXED)
async function checkInitial(){

  const { data: initialData } = await supabaseClient
    .from("credentials")
    .select("is_approved, role")
    .eq("phone", phone)
    .eq("meeting_id", meeting)
    .single();

  if(initialData?.is_approved){
    window.location.href =
      `meeting.html?id=${meeting}` +
      `&user=${phone}` +
      `&role=${initialData.role || "user"}` +
      `&name=${encodeURIComponent(userName)}`;
  }

}
  
supabaseClient
.channel("waiting-" + meeting)
.on(
  "postgres_changes",
  {
    event: "UPDATE",
    schema: "public",
    table: "credentials",
    filter: `meeting_id=eq.${meeting}`
  },
  (payload) => {
console.log("REALTIME EVENT:", payload);
    // 🔥 ONLY CURRENT USER
    const incomingPhone = String(payload.new.phone).slice(-10);
const currentPhone = String(phone).slice(-10);

if(incomingPhone === currentPhone && payload.new.is_approved){
      window.location.href =
        `meeting.html?id=${meeting}` +
        `&user=${phone}` +
        `&role=${payload.new.role || "user"}` +
        `&name=${encodeURIComponent(userName)}`;
    }

  }
)
.subscribe();

// 🔥 FALLBACK CHECK (VERY IMPORTANT)
setInterval(async () => {

  const { data } = await supabaseClient
    .from("credentials")
    .select("is_approved, role")
    .eq("phone", phone)
    .eq("meeting_id", meeting)
    .single();

  if(data?.is_approved){
    window.location.href =
      `meeting.html?id=${meeting}` +
      `&user=${phone}` +
      `&role=${data.role || "user"}` +
      `&name=${encodeURIComponent(userName)}`;
  }

}, 2000);
  
</script>

</body>
</html>
